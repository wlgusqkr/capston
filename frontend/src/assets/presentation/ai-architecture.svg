<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="785" viewBox="0 0 1200 785" role="img" aria-label="자취맵 AI Agent 구조도">
  <defs>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#A8DCC6" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2 2 10 6 2 10" fill="none" stroke="#047857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .bg { fill: #F2FBF6; }
      .grid { fill: url(#grid); opacity: .72; }
      .panel { fill: rgba(255,255,255,.72); stroke: #A8DCC6; stroke-width: 1; }
      .panel-soft { fill: rgba(221,246,233,.52); stroke: #A8DCC6; stroke-width: 1; }
      .panel-hot { fill: #DDF6E9; stroke: #047857; stroke-width: 1.4; }
      .ink { fill: #18211E; font-family: Pretendard, Arial, sans-serif; }
      .serif { fill: #18211E; font-family: Georgia, "Times New Roman", serif; font-weight: 700; }
      .muted { fill: #42514C; font-family: Pretendard, Arial, sans-serif; }
      .accent { fill: #047857; font-family: Pretendard, Arial, sans-serif; font-weight: 800; }
      .caption { fill: #71847B; font-family: Pretendard, Arial, sans-serif; font-weight: 700; }
      .code { fill: #0D9488; font-family: Georgia, "Times New Roman", serif; font-weight: 800; }
      .line { stroke: #047857; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .thin { stroke: #A8DCC6; stroke-width: 1; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="785"/>
  <rect class="grid" x="28" y="28" width="1144" height="729"/>
  <rect x="28" y="28" width="1144" height="729" fill="none" stroke="#A8DCC6"/>

  <text class="accent" x="60" y="72" font-size="16">AI AGENT FLOW</text>
  <text class="serif" x="60" y="122" font-size="42">질문을 안전한 공공데이터 답변으로 변환합니다</text>
  <text class="muted" x="60" y="160" font-size="20">자연어 질문을 분류하고, 읽기 전용 SQL 조회와 검증 단계를 거쳐 답변과 시각화로 반환합니다.</text>

  <g transform="translate(60 220)">
    <rect class="panel" x="0" y="0" width="180" height="178"/>
    <text class="code" x="22" y="36" font-size="30">01</text>
    <text class="serif" x="22" y="78" font-size="26">사용자 질문</text>
    <text class="accent" x="22" y="108" font-size="13">AI 패널</text>
    <text class="muted" x="22" y="137" font-size="16">동네 추천,</text>
    <text class="muted" x="22" y="160" font-size="16">시설·월세 질문</text>
  </g>

  <path class="line" d="M248 309H283"/>

  <g transform="translate(285 220)">
    <rect class="panel" x="0" y="0" width="180" height="178"/>
    <text class="code" x="22" y="36" font-size="30">02</text>
    <text class="serif" x="22" y="78" font-size="26">질문 분류</text>
    <text class="accent" x="22" y="108" font-size="13">route · query type</text>
    <text class="muted" x="22" y="137" font-size="16">추천 / 정보 /</text>
    <text class="muted" x="22" y="160" font-size="16">직접 답변 판단</text>
  </g>

  <path class="line" d="M473 309H508"/>

  <g transform="translate(510 220)">
    <rect class="panel-hot" x="0" y="0" width="180" height="178"/>
    <text class="code" x="22" y="36" font-size="30">03</text>
    <text class="serif" x="22" y="78" font-size="26">SQL 생성</text>
    <text class="accent" x="22" y="108" font-size="13">Text-to-SQL</text>
    <text class="muted" x="22" y="137" font-size="16">스키마·조인 힌트로</text>
    <text class="muted" x="22" y="160" font-size="16">조회 계획 생성</text>
  </g>

  <path class="line" d="M698 309H733"/>

  <g transform="translate(735 220)">
    <rect class="panel" x="0" y="0" width="180" height="178"/>
    <text class="code" x="22" y="36" font-size="30">04</text>
    <text class="serif" x="22" y="78" font-size="26">안전 검증</text>
    <text class="accent" x="22" y="108" font-size="13">SQL guard</text>
    <text class="muted" x="22" y="137" font-size="16">SELECT만 허용,</text>
    <text class="muted" x="22" y="160" font-size="16">위험 쿼리 차단</text>
  </g>

  <path class="line" d="M923 309H958"/>

  <g transform="translate(960 220)">
    <rect class="panel" x="0" y="0" width="180" height="178"/>
    <text class="code" x="22" y="36" font-size="30">05</text>
    <text class="serif" x="22" y="78" font-size="26">답변 반환</text>
    <text class="accent" x="22" y="108" font-size="13">answer package</text>
    <text class="muted" x="22" y="137" font-size="16">추천 근거,</text>
    <text class="muted" x="22" y="160" font-size="16">표·차트 제공</text>
  </g>

  <g transform="translate(60 452)">
    <rect class="panel-soft" x="0" y="0" width="520" height="162"/>
    <text class="accent" x="24" y="34" font-size="16">CONTEXT</text>
    <text class="serif" x="24" y="72" font-size="30">정확한 조회를 위한 맥락</text>
    <line class="thin" x1="24" y1="92" x2="496" y2="92"/>
    <text class="muted" x="24" y="124" font-size="17">schema context · table metadata · store codes</text>
    <text class="muted" x="24" y="150" font-size="17">최근 대화 히스토리로 이전 추천 동네 맥락 유지</text>
  </g>

  <g transform="translate(620 452)">
    <rect class="panel-soft" x="0" y="0" width="520" height="162"/>
    <text class="accent" x="24" y="34" font-size="16">SAFETY BOUNDARY</text>
    <text class="serif" x="24" y="72" font-size="30">쓰기 권한과 LLM 출력을 분리</text>
    <line class="thin" x1="24" y1="92" x2="496" y2="92"/>
    <text class="muted" x="24" y="124" font-size="17">AI_AGENT_DATABASE_URL로 read-only DB 계정 강제</text>
    <text class="muted" x="24" y="150" font-size="17">다중 문장, UPDATE/DELETE, SELECT * 등 차단</text>
  </g>

  <g transform="translate(60 655)">
    <rect class="panel" x="0" y="0" width="1080" height="74"/>
    <text class="accent" x="24" y="44" font-size="16">OUTPUT</text>
    <text class="serif" x="125" y="46" font-size="28">자연어 답변</text>
    <text class="caption" x="310" y="46" font-size="17">추천 동네</text>
    <text class="caption" x="455" y="46" font-size="17">표/막대/선 차트</text>
    <text class="caption" x="655" y="46" font-size="17">후보 비교</text>
    <text class="caption" x="800" y="46" font-size="17">실제 매물·체크리스트 연결</text>
  </g>
</svg>
